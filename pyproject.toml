[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vorflow"
version = "0.3.0"
description = "Voronoi mesh generation for MODFLOW 6 using Gmsh and GeoPandas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Rui Hugman"},
    {name = "Oscar Sanchez", email = "oscarfasanchez@gmail.com"},
]
maintainers = [
    {name = "Rui Hugman"},
    {name = "Oscar Sanchez", email = "oscarfasanchez@gmail.com"},
]
requires-python = ">=3.10"
keywords = ["modflow", "groundwater", "voronoi", "mesh", "gmsh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "geopandas>=0.13",
    "shapely>=2.1",
    "scipy>=1.10",
    "gmsh>=4.11",
]

[project.urls]
Repository = "https://github.com/rhugman/vorflow"
Issues = "https://github.com/rhugman/vorflow/issues"
Documentation = "https://rhugman.github.io/vorflow/"
Changelog = "https://github.com/rhugman/vorflow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
    "matplotlib",         # The plot() methods import it lazily; the library works without it
]
examples = [
    "matplotlib",         # Plotting in examples/ and notebooks; the library itself never imports it
    "flopy>=3.10",        # MF6/MFUSG examples and optional package wrappers
]
docs = [
    "sphinx>=7",
    "myst-nb>=1.1",       # Markdown pages and executed example notebooks
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton",
    "ipykernel",
    "matplotlib",
    "flopy>=3.10",        # Executed MF6/MFUSG notebooks also need their binaries
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "jupyter",
    "matplotlib",
    "build>=1.2",
    "packaging",          # scripts/check_dist.py
    "twine>=6",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# set_verbosity(1) must run before the submodules are imported so their
# loggers inherit the default console behavior.
"src/vorflow/__init__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: gmsh-heavy end-to-end tests (deselect with -m 'not slow')",
]
