name: vorflow
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  - gmsh
  # python-gmsh carries the pip metadata for conda's gmsh. Without it, pip
  # installs the PyPI wheel on top, whose bundled OpenMP aborts on macOS.
  - python-gmsh
  - geopandas
  - shapely
  - numpy
  - pandas
  - scipy
  - pyproj
  - pytest
  - jupyter
  - matplotlib
  - flopy>=3.10
  - pip:
      - -e ..[dev,examples]
