name: docs

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

# Pages serves one site: main at the root and develop under /dev/. Every push
# to either branch rebuilds both. Deploying needs Pages set to "GitHub
# Actions", and main and develop allowed in the github-pages environment.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'docs-pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: etc/environment.yml
          # modflow6 provides the mf6 binary the MODFLOW example notebooks run.
          create-args: >-
            python=3.12
            modflow6
          cache-environment: true
      - name: Install docs dependencies
        shell: bash -l {0}
        run: python -m pip install -e ".[docs]"
      - name: Install MODFLOW-USG executable
        shell: bash -l {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: get-modflow "$CONDA_PREFIX/bin" --subset mfusg --release-id 29.0
      - name: Check MODFLOW grid exports with FloPy installed
        shell: bash -l {0}
        run: pytest tests/test_disv.py tests/test_mfusg.py
      - name: Build HTML (warnings are errors; notebooks are executed)
        shell: bash -l {0}
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  site:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: _stable
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: _dev
      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: etc/environment.yml
          # modflow6 provides the mf6 binary the MODFLOW example notebooks run.
          create-args: >-
            python=3.12
            modflow6
          cache-environment: true
      - name: Install docs dependencies
        shell: bash -l {0}
        run: python -m pip install -e ".[docs]"
      - name: Install MODFLOW-USG executable
        shell: bash -l {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: get-modflow "$CONDA_PREFIX/bin" --subset mfusg --release-id 29.0
      # conf.py imports vorflow from its own checkout's src/, so each build
      # documents its branch whatever is installed. Builds go to _build/ so
      # doctrees and the notebook cache stay out of the published _site/.
      - name: Build develop docs
        shell: bash -l {0}
        env:
          VORFLOW_DOCS_CHANNEL: dev
        run: sphinx-build -W --keep-going -b html _dev/docs _build/dev/html
      - name: Build main docs
        shell: bash -l {0}
        run: |
          if [ -f _stable/docs/conf.py ]; then
            sphinx-build -W --keep-going -b html _stable/docs _build/stable/html
          fi
      - name: Assemble site (main at the root, develop under /dev/)
        run: |
          mkdir -p _site
          if [ -d _build/stable/html ]; then
            cp -R _build/stable/html/. _site/
          else
            # Before main has docs, send the root to /dev/.
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=dev/"><a href="dev/">Development docs</a>\n' > _site/index.html
          fi
          cp -R _build/dev/html _site/dev
          rm -rf _site/.doctrees _site/dev/.doctrees
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
